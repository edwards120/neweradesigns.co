name: Shopify Theme Validation

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-theme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Shopify structure and references
        run: node scripts/validate-theme.mjs
